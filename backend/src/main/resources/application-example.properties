# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/elwaseet_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_DB_PASSWORD_HERE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=YOUR_JWT_SECRET_KEY_HERE
jwt.expiration=86400000

# Server Port
server.port=8080

# Email config
resend.api.key=YOUR_RESEND_API_KEY_HERE
email.fromEmail=noreply@elwaseet.com
email.fromName=Elwaseet Platform
